name: Web-Fassung veröffentlichen

# Legt die Web-Fassung der App auf GitHub Pages ab. Fester Link (auch für Newsletter und iPhone):
#   https://wolfgangtiefenthaler78-sys.github.io/antreiber/
# Datenschutz und Impressum (Link für die Stores):
#   https://wolfgangtiefenthaler78-sys.github.io/antreiber/datenschutz.html
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: GitHub Pages einschalten (falls noch nicht)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
